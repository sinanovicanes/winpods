[package]
name = "winpods"
description = "AirPods integration for Windows."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "winpods_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
winpods-apple-cp = { workspace = true }
winpods-bluetooth = { workspace = true }
winpods-core = { workspace = true }
winpods-media = { workspace = true }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2.3.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.5.1"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
